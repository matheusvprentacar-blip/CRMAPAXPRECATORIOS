name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm install

      - name: Validate Public Env Vars
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NEXT_PUBLIC_SUPABASE_URL)) {
            Write-Error "Missing secret NEXT_PUBLIC_SUPABASE_URL"
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:NEXT_PUBLIC_SUPABASE_ANON_KEY)) {
            Write-Error "Missing secret NEXT_PUBLIC_SUPABASE_ANON_KEY"
            exit 1
          }

      - name: Build Next.js
        run: npm run build

      - name: Resolve Release Notes
        id: release_notes
        shell: pwsh
        run: |
          $tagName = $env:GITHUB_REF_NAME

          if ([string]::IsNullOrWhiteSpace($tagName) -or $env:GITHUB_REF_TYPE -ne "tag") {
            $tagName = (git describe --tags --abbrev=0)
          }

          if ([string]::IsNullOrWhiteSpace($tagName)) {
            Write-Error "Nao foi possivel identificar a tag da release."
            exit 1
          }

          $notes = git for-each-ref "refs/tags/$tagName" --format='%(contents)'
          if ([string]::IsNullOrWhiteSpace($notes)) {
            Write-Error "Tag $tagName sem notas. Use -ReleaseNotes ou -ReleaseNotesFile no release:update."
            exit 1
          }

          $notes = $notes.Trim()
          "tag_name=$tagName" >> $env:GITHUB_OUTPUT
          "release_body<<EOF" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Align Tauri Rust Lockfile
        shell: pwsh
        run: cargo update -p tauri --precise 2.9.5 --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri and Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_SIGNING_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release_notes.outputs.tag_name }}
          releaseName: ${{ steps.release_notes.outputs.tag_name }}
          releaseBody: ${{ steps.release_notes.outputs.release_body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Ensure updater latest.json
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release_notes.outputs.tag_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $repo = $env:GITHUB_REPOSITORY
          $tagName = $env:TAG_NAME

          if ([string]::IsNullOrWhiteSpace($tagName)) {
            Write-Error "TAG_NAME ausente."
            exit 1
          }

          $release = gh release view $tagName --repo $repo --json tagName,publishedAt,body,assets | ConvertFrom-Json
          $assets = @($release.assets)

          $exeAsset = $assets | Where-Object { $_.name -match "_x64-setup\.exe$" } | Select-Object -First 1
          if (-not $exeAsset) {
            Write-Error "Executavel NSIS nao encontrado para gerar latest.json."
            exit 1
          }

          $exeSigAsset = $assets | Where-Object { $_.name -eq "$($exeAsset.name).sig" } | Select-Object -First 1
          if (-not $exeSigAsset) {
            Write-Error "Assinatura do executavel nao encontrada: $($exeAsset.name).sig"
            exit 1
          }

          $msiAsset = $assets | Where-Object { $_.name -match "_x64_en-US\.msi$" } | Select-Object -First 1
          $msiSigAsset = $null
          if ($msiAsset) {
            $msiSigAsset = $assets | Where-Object { $_.name -eq "$($msiAsset.name).sig" } | Select-Object -First 1
          }

          $tmpDir = Join-Path $env:RUNNER_TEMP "tauri-updater-json"
          New-Item -ItemType Directory -Path $tmpDir -Force | Out-Null

          gh release download $tagName --repo $repo --pattern $exeSigAsset.name --dir $tmpDir --clobber | Out-Null
          $exeSig = (Get-Content -Raw (Join-Path $tmpDir $exeSigAsset.name)).Trim()

          $platforms = [ordered]@{
            "windows-x86_64" = [ordered]@{
              signature = $exeSig
              url = $exeAsset.url
            }
            "windows-x86_64-nsis" = [ordered]@{
              signature = $exeSig
              url = $exeAsset.url
            }
          }

          if ($msiAsset -and $msiSigAsset) {
            gh release download $tagName --repo $repo --pattern $msiSigAsset.name --dir $tmpDir --clobber | Out-Null
            $msiSig = (Get-Content -Raw (Join-Path $tmpDir $msiSigAsset.name)).Trim()
            $platforms["windows-x86_64-msi"] = [ordered]@{
              signature = $msiSig
              url = $msiAsset.url
            }
          }

          $version = $release.tagName.TrimStart("v")
          $notes = if ([string]::IsNullOrWhiteSpace($release.body)) { "See the assets to download this version and install." } else { $release.body.Trim() }

          $latest = [ordered]@{
            version = $version
            notes = $notes
            pub_date = ([datetime]::Parse($release.publishedAt).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ss.fffZ"))
            platforms = $platforms
          }

          $latestPath = Join-Path $tmpDir "latest.json"
          [System.IO.File]::WriteAllText(
            $latestPath,
            ($latest | ConvertTo-Json -Depth 20),
            [System.Text.UTF8Encoding]::new($false)
          )

          gh release upload $tagName $latestPath --repo $repo --clobber | Out-Null
