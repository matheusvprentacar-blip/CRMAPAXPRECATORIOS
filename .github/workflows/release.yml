name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm install

      - name: Validate Public Env Vars
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NEXT_PUBLIC_SUPABASE_URL)) {
            Write-Error "Missing secret NEXT_PUBLIC_SUPABASE_URL"
            exit 1
          }
          if ([string]::IsNullOrWhiteSpace($env:NEXT_PUBLIC_SUPABASE_ANON_KEY)) {
            Write-Error "Missing secret NEXT_PUBLIC_SUPABASE_ANON_KEY"
            exit 1
          }

      - name: Build Next.js
        run: npm run build

      - name: Resolve Release Notes
        id: release_notes
        shell: pwsh
        run: |
          $tagName = $env:GITHUB_REF_NAME

          if ([string]::IsNullOrWhiteSpace($tagName) -or $env:GITHUB_REF_TYPE -ne "tag") {
            $tagName = (git describe --tags --abbrev=0)
          }

          if ([string]::IsNullOrWhiteSpace($tagName)) {
            Write-Error "Nao foi possivel identificar a tag da release."
            exit 1
          }

          $notes = git for-each-ref "refs/tags/$tagName" --format='%(contents)'
          if ([string]::IsNullOrWhiteSpace($notes)) {
            Write-Error "Tag $tagName sem notas. Use -ReleaseNotes ou -ReleaseNotesFile no release:update."
            exit 1
          }

          $notes = $notes.Trim()
          "tag_name=$tagName" >> $env:GITHUB_OUTPUT
          "release_body<<EOF" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Build Tauri and Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || secrets.TAURI_SIGNING_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release_notes.outputs.tag_name }}
          releaseName: ${{ steps.release_notes.outputs.tag_name }}
          releaseBody: ${{ steps.release_notes.outputs.release_body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
